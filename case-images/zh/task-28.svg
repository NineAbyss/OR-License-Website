<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-28 desc-28"><title id="title-28">软机会约束调控</title><desc id="desc-28">根据历史信息选定受保护站点，并评估同一单车调运方案在这些站点的缺车事件。示意性的事件率带区分允许范围和超出的松弛量，后者会产生惩罚。该带状图不代表实测数据。</desc><defs><marker id="arrow-28" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g font-family="Arial, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect width="640" height="320" fill="#f3f6f4" /><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">案例 28</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">软机会约束调控</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1" /><text x="109" y="96" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="109" dy="0">历史信息</tspan></text><path d="M109 106 L109 128" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)" /><text x="109" y="153" fill="#13241d" font-size="17" font-weight="500" text-anchor="middle"><tspan x="109" dy="0">受保护站点</tspan></text><circle cx="51" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2" /><circle cx="109" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2" /><circle cx="167" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2" /><path d="M190 198 H223" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)" /><rect x="289" y="77" width="230" height="42" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5" /><text x="404.0" y="103.0" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="404.0" dy="0">共享调运方案</tspan></text><path d="M404 120 L404 150" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)" /><text x="407" y="177" fill="#13241d" font-size="19" font-weight="600" text-anchor="middle"><tspan x="407" dy="0">缺车事件率</tspan></text><rect x="244" y="194" width="170" height="28" rx="3" fill="#196748" stroke="#196748" stroke-width="1.5" /><rect x="414" y="194" width="175" height="28" rx="3" fill="#d5f17a" stroke="#196748" stroke-width="1.5" /><path d="M414 184 L414 232" fill="none" stroke="#13241d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="328" y="251" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="328" dy="0">限额内</tspan></text><text x="501" y="251" fill="#196748" font-size="17" font-weight="600" text-anchor="middle"><tspan x="501" dy="0">受惩罚的松弛量</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1" /><text x="24" y="303" fill="#56695d" font-size="16">软经验机会约束：超额事件产生额外惩罚</text></g></svg>