<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-30 desc-30"><title id="title-30">分布鲁棒共享单车调控</title><desc id="desc-30">在分布模糊集允许的情景概率下，评估历史情景与共享调运方案。目标关注该集合内最坏的期望运营损失，而非单个情景的最大损失。</desc><defs><marker id="arrow-30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g font-family="Arial, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect width="640" height="320" fill="#f3f6f4" /><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">案例 30</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">分布鲁棒共享单车调控</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1" /><rect x="24" y="96" width="139" height="66" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5" /><text x="93.5" y="124.0" fill="#13241d" font-size="19" font-weight="500" text-anchor="middle"><tspan x="93.5" dy="0">Historical</tspan><tspan x="93.5" dy="20">scenarios</tspan></text><rect x="24" y="208" width="139" height="49" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5" /><text x="93.5" y="237.5" fill="#13241d" font-size="19" font-weight="500" text-anchor="middle"><tspan x="93.5" dy="0">共享方案</tspan></text><path d="M163 129 H184 V151 H208" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)" /><path d="M163 232 H184 V201 H208" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)" /><ellipse cx="331" cy="176" rx="115" ry="84" fill="#ffffff" stroke="#4c8c87" stroke-width="2" stroke-dasharray="6 5" /><text x="331" y="83" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="331" dy="0">分布模糊集</tspan></text><text x="331" y="126"