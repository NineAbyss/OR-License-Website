<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-20 desc-20"><title id="title-20">基于截至当时信息的纯多头配置</title><desc id="desc-20">使用截至时点 t 可用的历史信息确定非负投资组合权重。不使用未来信息，并通过固定回测流程评估产生的交易轨迹。</desc><defs><marker id="arrow-20" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g font-family="Arial, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect width="640" height="320" fill="#f3f6f4" /><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">案例 20</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">基于截至当时信息的纯多头配置</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1" /><text x="31" y="80" fill="#13241d" font-size="18" font-weight="600" text-anchor="start"><tspan x="31" dy="0">信息时间线</tspan></text><rect x="30" y="94" width="275" height="40" rx="2" fill="#d5f17a" stroke="#d5f17a" stroke-width="1.5" /><rect x="305" y="94" width="303" height="40" rx="2" fill="#ffffff" stroke="#b5c7bb" stroke-width="1.5" stroke-dasharray="4 4" /><text x="166" y="120" fill="#13241d" font-size="18" font-weight="400" text-anchor="middle"><tspan x="166" dy="0">可用历史信息</tspan></text><text x="464" y="120" fill="#56695d" font-size="18" font-weight="400" text-anchor="middle"><tspan x="464" dy="0">不使用未来数据</tspan></text><path d="M305 87 L305 148" fill="none" stroke="#196748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="305" y="166" fill="#196748" font-size="17" font-weight="600" text-anchor="middle"><tspan x="305" dy="0">截至 t</tspan></text><path d="M168 141 V158 H92 V218 H124" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-20)" /><path d="M139 246 L283 246" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="157" y="213" width="24" height="33" rx="1" fill="#d5f17a" stroke="#196748" stroke-width="1.5" /><rect x="197" y="184" width="24" height="62" rx="1" fill="#d5f17a" stroke="#196748" stroke-width="1.5" /><rect x="237" y="200" width="24" height="46" rx="1" fill="#d5f17a" stroke="#196748" stroke-width="1.5" /><text x="211" y="180" fill="#13241d" font-size="18" font-weight="600" text-anchor="middle"><tspan x="211" dy="0">权重 ≥ 0</tspan></text><path d="M292 223 L345 223" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-20)" /><rect x="360" y="184" width="248" height="77" rx="4" fill="#ffffff" stroke="#196748" stroke-width="1.5" /><text x="484" y="210" fill="#13241d" font-size="18" font-weight="600" text-anchor="middle"><tspan x="484" dy="0">固定回测</tspan></text><path d="M379 243 H423 V234 H466 V243 H510 V230 H586" fill="none" stroke="#4c8c87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="483" y="179" fill="#56695d" font-size="16" font-weight="400" text-anchor="middle"><tspan x="483" dy="0">交易轨迹</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1" /><text x="24" y="303" fill="#56695d" font-size="16">截至当时可用的信息 · 纯多头权重 · 固定回测</text></g></svg>