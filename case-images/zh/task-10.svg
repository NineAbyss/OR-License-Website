<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-10 desc-10"><title id="title-10">固定比例配煤</title><desc id="desc-10">煤炭库存料斗向固定比例混配供料，并须满足物料用量上下限和质量要求。</desc><defs><marker id="arrow-10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g font-family="Arial, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect width="640" height="320" fill="#f3f6f4" /><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">案例 10</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">固定比例配煤</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1" /><path d="M32 76H206V121L139 148H99L32 121Z" fill="#ffffff" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 117H198L136 141H102Z" fill="#d5f17a" stroke="#d5f17a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="119" y="106" fill="#13241d" font-size="19" font-weight="600" text-anchor="middle"><tspan x="119" dy="0">煤种 A</tspan></text><path d="M119 149 L119 169" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M233 76H407V121L340 148H300L233 121Z" fill="#ffffff" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M241 117H399L337 141H303Z" fill="#d5f17a" stroke="#d5f17a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="106" fill="#13241d" font-size="19" font-weight="600" text-anchor="middle"><tspan x="320" dy="0">煤种 B</tspan></text><path d="M320 149 L320 169" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M434 76H608V121L541 148H501L434 121Z" fill="#ffffff" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M442 117H600L538 141H504Z" fill="#d5f17a" stroke="#d5f17a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="521" y="106" fill="#13241d" font-size="19" font-weight="600" text-anchor="middle"><tspan x="521" dy="0">煤种 C</tspan></text><path d="M521 149 L521 169" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M119 169V215H282" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-10)" /><path d="M320 149 L320 179" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-10)" /><path d="M521 169V178H356V202" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-10)" /><circle cx="320" cy="215" r="34" fill="#196748" stroke="#196748" stroke-width="2" /><text x="320" y="220" fill="#ffffff" font-size="18" font-weight="500" text-anchor="middle"><tspan x="320" dy="0">混配</tspan></text><text x="34" y="235" fill="#196748" font-size="18" font-weight="600" text-anchor="start"><tspan x="34" dy="0">固定比例</tspan></text><text x="34" y="261" fill="#13241d" font-size="21" font-weight="600" text-anchor="start"><tspan x="34" dy="0">a : b : c</tspan></text><path d="M355 215 L437 215" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-10)" /><rect x="445" y="196" width="163" height="49" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5" /><text x="526.5" y="225.5" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="526.5" dy="0">质量上下限</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1" /><text x="24" y="303" fill="#56695d" font-size="16">配方仅作示意；不预设比例或质量限值</text></g></svg>