"round" stroke-linejoin="round" marker-end="url(#arrow-15)" /><rect x="235" y="72" width="175" height="31" rx="0" fill="#f3f6f4" stroke="#f3f6f4" stroke-width="1.5" /><text x="322" y="94" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="322" dy="0">直接配送</tspan></text><text x="322" y="252" fill="#56695d" font-size="18" font-weight="400" text-anchor="middle"><tspan x="322" dy="0">两条路径均满足需求与服务要求</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1" /><text x="24" y="303" fill="#56695d" font-size="16">CDC 直达路径 · 可行流量 · 容量 · 客户服务</text></g></svg>