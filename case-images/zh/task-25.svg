<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-25 desc-25"><title id="title-25">单小时静态共享单车调度</title><desc id="desc-25">一条已提交的单小时路线连接示意单车站点 A、B 和 C。站点库存与沿途调运需统筹考虑；图中不涉及滚动重规划，也不展示实测数量。</desc><defs><marker id="arrow-25" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g font-family="Arial, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect width="640" height="320" fill="#f3f6f4" /><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">案例 25</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">单小时静态共享单车调度</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1" /><rect x="24" y="77" width="592" height="184" rx="8" fill="#ffffff" stroke="#b5c7bb" stroke-width="1.5" /><rect x="40" y="88" width="193" height="30" rx="8" fill="#d5f17a" stroke="#d5f17a" stroke-width="1.5" /><text x="136.5" y="108.0" fill="#196748" font-size="16" font-weight="500" text-anchor="middle"><tspan x="136.5" dy="0">一个已提交方案</tspan></text><text x="593" y="109" fill="#196748" font-size="20" font-weight="600" text-anchor="end"><tspan x="593" dy="0">1 小时</tspan></text><path d="M132 181 L277 155" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-25)" /><path d="M331 156 L493 190" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-25)" /><circle cx="105" cy="188" r="26" fill="#d5f17a" stroke="#196748" stroke-width="2" /><text x="105" y="193" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="105" dy="0">A</tspan></text><text x="105" y="240" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="105" dy="0">库存</tspan></text><circle cx="304" cy="150" r="26" fill="#d5f17a" stroke="#196748" stroke-width="2" /><text x="304" y="155" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="304" dy="0">B</tspan></text><text x="304" y="202" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="304" dy="0">库存</tspan></text><circle cx="520" cy="197" r="26" fill="#d5f17a" stroke="#196748" stroke-width="2" /><text x="520" y="202" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="520" dy="0">C</tspan></text><text x="520" y="249" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="520" dy="0">库存</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1" /><text x="24" y="303" fill="#56695d" font-size="16">选择一个路线和库存均可行的单小时方案</text></g></svg>