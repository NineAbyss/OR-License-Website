<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-29 desc-29"><title id="title-29">CVaR bike control</title><desc id="desc-29">A symbolic ordered loss band distinguishes all scenario operating losses from their high-loss tail. The shared plan balances relocation cost, mean operating loss, and CVaR tail risk. No empirical loss values or tail fraction are depicted.</desc><defs><marker id="arrow-29" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 29</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">CVaR bike control</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="91" fill="#196748" font-size="20" font-weight="600" text-anchor="start"><tspan x="24" dy="0">Ordered scenario losses</tspan></text><path d="M30 110 L609 110" fill="none" stroke="#4c8c87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-29)"/><text x="31" y="139" fill="#56695d" font-size="16" font-weight="400" text-anchor="start"><tspan x="31" dy="0">Lower → higher</tspan></text><rect x="30" y="155" width="580" height="54" rx="5" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><rect x="466" y="155" width="144" height="54" rx="5" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="245" y="188" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="245" dy="0">All scenario losses</tspan></text><text x="538" y="188" fill="#196748" font-size="18" font-weight="600" text-anchor="middle"><tspan x="538" dy="0">High-loss tail</tspan></text><path d="M31 217 V231 H607 V217" fill="none" stroke="#4c8c87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 231 L320 242" fill="none" stroke="#4c8c87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="263" fill="#4c8c87" font-size="19" font-weight="600" text-anchor="middle"><tspan x="320" dy="0">Mean loss</tspan></text><path d="M468 148 V132 H608 V148" fill="none" stroke="#196748" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="96" fill="#196748" font-size="19" font-weight="600" text-anchor="middle"><tspan x="537" dy="0">CVaR</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">Relocation cost + weighted mean loss + CVaR tail risk</text></g></svg>