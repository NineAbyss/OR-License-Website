<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-28 desc-28"><title id="title-28">Soft chance-constrained control</title><desc id="desc-28">Historical information selects protected stations. A shared bike-relocation plan is assessed for shortage events there. A symbolic event-rate band separates the permitted part from excess slack, which incurs a penalty. The band is not empirical data.</desc><defs><marker id="arrow-28" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 28</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">Soft chance-constrained control</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><text x="109" y="96" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="109" dy="0">History</tspan></text><path d="M109 106 L109 128" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)"/><text x="109" y="153" fill="#13241d" font-size="17" font-weight="500" text-anchor="middle"><tspan x="109" dy="0">Protected stations</tspan></text><circle cx="51" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2"/><circle cx="109" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2"/><circle cx="167" cy="198" r="21" fill="#d5f17a" stroke="#196748" stroke-width="2"/><path d="M190 198 H223" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)"/><rect x="289" y="77" width="230" height="42" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="404.0" y="103.0" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="404.0" dy="0">Shared relocation plan</tspan></text><path d="M404 120 L404 150" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-28)"/><text x="407" y="177" fill="#13241d" font-size="19" font-weight="600" text-anchor="middle"><tspan x="407" dy="0">Shortage-event rate</tspan></text><rect x="244" y="194" width="170" height="28" rx="3" fill="#196748" stroke="#196748" stroke-width="1.5"/><rect x="414" y="194" width="175" height="28" rx="3" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><path d="M414 184 L414 232" fill="none" stroke="#13241d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="328" y="251" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="328" dy="0">Within limit</tspan></text><text x="501" y="251" fill="#196748" font-size="17" font-weight="600" text-anchor="middle"><tspan x="501" dy="0">Penalized slack</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">Soft empirical chance constraint: excess events add a penalty</text></g></svg>