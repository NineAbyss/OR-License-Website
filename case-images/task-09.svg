<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-9 desc-9"><title id="title-9">Static cutting &amp; allocation</title><desc id="desc-9">Material stock is divided into matched demand pieces and remaining material, preserving the material balance.</desc><defs><marker id="arrow-9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 09</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">Static cutting &amp; allocation</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><text x="31" y="83" fill="#196748" font-size="18" font-weight="600" text-anchor="start"><tspan x="31" dy="0">Cut stock</tspan></text><text x="500" y="83" fill="#196748" font-size="18" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">Match demand</tspan></text><rect x="32" y="102" width="126" height="46" rx="8" fill="#196748" stroke="#196748" stroke-width="1.5"/><text x="95.0" y="130.0" fill="#ffffff" font-size="18" font-weight="500" text-anchor="middle"><tspan x="95.0" dy="0">Piece A</tspan></text><rect x="158" y="102" width="118" height="46" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="217.0" y="130.0" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="217.0" dy="0">Piece B</tspan></text><rect x="276" y="102" width="116" height="46" rx="8" fill="#f3f6f4" stroke="#196748" stroke-width="1.5"/><text x="334.0" y="130.0" fill="#13241d" font-size="16" font-weight="500" text-anchor="middle"><tspan x="334.0" dy="0">Remainder</tspan></text><path d="M158 95 L158 155" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M276 95 L276 155" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="480" y="101" width="126" height="49" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="543.0" y="130.5" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="543.0" dy="0">Demand A</tspan></text><rect x="480" y="181" width="126" height="49" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="543.0" y="210.5" fill="#13241d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="543.0" dy="0">Demand B</tspan></text><path d="M95 150V167H447V126H475" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9)"/><path d="M217 150V206H475" fill="none" stroke="#4c8c87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9)"/><path d="M32 235V247H392V235" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="266" fill="#196748" font-size="18" font-weight="600" text-anchor="start"><tspan x="32" dy="0">Stock = allocated + remainder</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">Schematic cuts; widths do not encode material quantities</text></g></svg>