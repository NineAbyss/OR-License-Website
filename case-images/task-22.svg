<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-22 desc-22"><title id="title-22">Equity with an IC futures hedge</title><desc id="desc-22">A long-equity portfolio and an IC futures hedge feed joint trading decisions. The resulting trading trajectory is evaluated with a fixed backtest; no hedge ratio or performance is assumed.</desc><defs><marker id="arrow-22" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 22</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">Equity with an IC futures hedge</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><rect x="24" y="79" width="216" height="168" rx="8" fill="#ffffff" stroke="#b5c7bb" stroke-width="1.5"/><text x="43" y="106" fill="#196748" font-size="20" font-weight="600" text-anchor="start"><tspan x="43" dy="0">Long equity</tspan></text><rect x="43" y="123" width="49" height="35" rx="4" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><rect x="103" y="123" width="49" height="35" rx="4" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><rect x="163" y="123" width="49" height="35" rx="4" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="132" y="151" fill="#13241d" font-size="18" font-weight="400" text-anchor="start"><tspan x="132" dy="0"></tspan></text><path d="M132 161 L132 184" fill="none" stroke="#4c8c87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-22)"/><rect x="43" y="192" width="178" height="39" rx="8" fill="#196748" stroke="#196748" stroke-width="1.5"/><text x="132.0" y="216.5" fill="#ffffff" font-size="18" font-weight="500" text-anchor="middle"><tspan x="132.0" dy="0">IC futures hedge</tspan></text><path d="M240 126 H283 V150 H313" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-22)"/><path d="M240 211 H283 V184 H313" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-22)"/><rect x="324" y="135" width="127" height="66" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="387.5" y="163.0" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="387.5" dy="0">Joint</tspan><tspan x="387.5" dy="20">trades</tspan></text><path d="M451 168 L482 168" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-22)"/><text x="550" y="97" fill="#13241d" font-size="18" font-weight="600" text-anchor="middle"><tspan x="550" dy="0">Trade path</tspan></text><path d="M502 132 L597 132" fill="none" stroke="#4c8c87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="502" cy="132" r="5" fill="#196748" stroke="#196748" stroke-width="2"/><circle cx="550" cy="132" r="5" fill="#196748" stroke="#196748" stroke-width="2"/><circle cx="597" cy="132" r="5" fill="#196748" stroke="#196748" stroke-width="2"/><path d="M550 142 L550 179" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-22)"/><rect x="486" y="190" width="129" height="47" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="550.5" y="218.5" fill="#13241d" font-size="20" font-weight="500" text-anchor="middle"><tspan x="550.5" dy="0">Backtest</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">Joint equity and hedge trades feed a fixed backtest</text></g></svg>