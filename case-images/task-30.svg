<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-30 desc-30"><title id="title-30">Distributionally robust bike control</title><desc id="desc-30">Historical scenarios and a shared relocation plan are evaluated under admissible scenario probabilities in an ambiguity set. The objective considers the worst expected operating loss over that set, rather than a maximum individual scenario loss.</desc><defs><marker id="arrow-30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 30</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">Distributionally robust bike control</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><rect x="24" y="96" width="139" height="66" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="93.5" y="124.0" fill="#13241d" font-size="19" font-weight="500" text-anchor="middle"><tspan x="93.5" dy="0">Historical</tspan><tspan x="93.5" dy="20">scenarios</tspan></text><rect x="24" y="208" width="139" height="49" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="93.5" y="237.5" fill="#13241d" font-size="19" font-weight="500" text-anchor="middle"><tspan x="93.5" dy="0">Shared plan</tspan></text><path d="M163 129 H184 V151 H208" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)"/><path d="M163 232 H184 V201 H208" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)"/><ellipse cx="331" cy="176" rx="115" ry="84" fill="#ffffff" stroke="#4c8c87" stroke-width="2" stroke-dasharray="6 5"/><text x="331" y="83" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="331" dy="0">Ambiguity set</tspan></text><text x="331" y="126" fill="#13241d" font-size="17" font-weight="400" text-anchor="middle"><tspan x="331" dy="0">Allowed weights</tspan></text><rect x="269" y="153" width="43" height="23" rx="3" fill="#f3f6f4" stroke="#4c8c87" stroke-width="1.5"/><path d="M287.92 154 L287.92 175" fill="none" stroke="#4c8c87" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="311" y="193" width="53" height="23" rx="3" fill="#f3f6f4" stroke="#4c8c87" stroke-width="1.5"/><path d="M334.32 194 L334.32 215" fill="none" stroke="#4c8c87" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="165" width="55" height="23" rx="3" fill="#f3f6f4" stroke="#4c8c87" stroke-width="1.5"/><path d="M386.2 166 L386.2 187" fill="none" stroke="#4c8c87" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 166 L355 177" fill="none" stroke="#4c8c87" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)" stroke-dasharray="3 4"/><text x="331" y="241" fill="#196748" font-size="17" font-weight="600" text-anchor="middle"><tspan x="331" dy="0">Worst expectation</tspan></text><path d="M449 176 L475 176" fill="none" stroke="#196748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-30)"/><rect x="486" y="132" width="128" height="89" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="550.0" y="161.5" fill="#13241d" font-size="19" font-weight="500" text-anchor="middle"><tspan x="550.0" dy="0">Worst</tspan><tspan x="550.0" dy="20">expected</tspan><tspan x="550.0" dy="20">loss</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">Vary scenario probabilities; minimize worst expected loss</text></g></svg>