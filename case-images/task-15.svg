<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title-15 desc-15"><title id="title-15">CDC direct delivery</title><desc id="desc-15">A CDC can serve customers directly along a highlighted bypass or through an intermediate network node, under the same flow and service constraints.</desc><defs><marker id="arrow-15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#196748" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="640" height="320" fill="#f3f6f4"/><text x="24" y="35" fill="#196748" font-size="16" font-weight="600">CASE 15</text><text x="116" y="35" fill="#13241d" font-size="20" font-weight="600">CDC direct delivery</text><path d="M24 51H616" stroke="#b5c7bb" stroke-width="1"/><rect x="32" y="148" width="110" height="62" rx="8" fill="#d5f17a" stroke="#196748" stroke-width="1.5"/><text x="87.0" y="184.0" fill="#13241d" font-size="22" font-weight="600" text-anchor="middle"><tspan x="87.0" dy="0">CDC</tspan></text><rect x="255" y="148" width="133" height="62" rx="8" fill="#ffffff" stroke="#196748" stroke-width="1.5"/><text x="321.5" y="184.0" fill="#13241d" font-size="17" font-weight="500" text-anchor="middle"><tspan x="321.5" dy="0">Network node</tspan></text><circle cx="554" cy="180" r="36" fill="#ffffff" stroke="#196748" stroke-width="2"/><text x="554" y="185" fill="#13241d" font-size="16" font-weight="500" text-anchor="middle"><tspan x="554" dy="0">Customer</tspan></text><path d="M152 180 L244 180" fill="none" stroke="#196748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-15)"/><path d="M398 180 L508 180" fill="none" stroke="#196748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-15)"/><path d="M87 137 V106 Q87 88 105 88 H536 Q554 88 554 106 V133" fill="none" stroke="#196748" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-15)"/><rect x="235" y="72" width="175" height="31" rx="0" fill="#f3f6f4" stroke="#f3f6f4" stroke-width="1.5"/><text x="322" y="94" fill="#196748" font-size="20" font-weight="600" text-anchor="middle"><tspan x="322" dy="0">Direct delivery</tspan></text><text x="322" y="252" fill="#56695d" font-size="18" font-weight="400" text-anchor="middle"><tspan x="322" dy="0">Both routes meet demand and service</tspan></text><path d="M24 278H616" stroke="#b5c7bb" stroke-width="1"/><text x="24" y="303" fill="#56695d" font-size="16">CDC bypass · feasible flow · capacity · customer service</text></g></svg>